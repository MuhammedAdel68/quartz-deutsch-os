# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Quartz German Learning Lab
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: de-DE
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .quartz
    - public
    - node_modules
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Outfit
      body: Inter
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#f8fafc"
        lightgray: "#e2e8f0"
        gray: "#94a3b8"
        darkgray: "#334155"
        dark: "#0f172a"
        secondary: "#6d28d9"
        tertiary: "#059669"
        highlight: "rgba(109, 40, 217, 0.1)"
        textHighlight: "rgba(5, 150, 105, 0.3)"
      darkMode:
        light: "#0a0f1d"
        lightgray: "#1a2035"
        gray: "#6b7280"
        darkgray: "#e2e8f0"
        dark: "#ffffff"
        secondary: "#8b5cf6"
        tertiary: "#10b981"
        highlight: "rgba(139, 92, 246, 0.15)"
        textHighlight: "rgba(16, 185, 129, 0.5)"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
  - source: github:quartz-community/syntax-highlighting
    enabled: true
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
  - source: github:quartz-community/table-of-contents
    enabled: true
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
  - source: github:quartz-community/description
    enabled: true
  - source: github:quartz-community/latex
    enabled: true
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
layout:
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    folder:
      positions:
        right: []
    tag:
      positions:
        right: []
